<svg width="884" height="1779" viewBox="0 0 884 1779" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Device Shadow -->
    <filter id="phoneShadow" x="-10%" y="-5%" width="120%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="24" stdDeviation="36" flood-color="#000000" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#2D8B8B" flood-opacity="0.2"/>
    </filter>
    
    <!-- Chassis Gradients -->
    <linearGradient id="bodyBezel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A4652" />
      <stop offset="35%" stop-color="#1E2833" />
      <stop offset="70%" stop-color="#0D151D" />
      <stop offset="100%" stop-color="#222E3A" />
    </linearGradient>
    
    <linearGradient id="rimMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748B" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#1E293B" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#475569" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="heroCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A4F4F" />
      <stop offset="45%" stop-color="#206E6E" />
      <stop offset="100%" stop-color="#16212E" />
    </linearGradient>

    <linearGradient id="glowOrb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D8B8B" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#2D8B8B" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="progressGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2D8B8B" />
      <stop offset="100%" stop-color="#4C9A7D" />
    </linearGradient>

    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D8B8B" />
      <stop offset="100%" stop-color="#206E6E" />
    </linearGradient>

    <linearGradient id="sosGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>

    <linearGradient id="screenGlassSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14" />
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.04" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <clipPath id="screenClip">
      <rect x="42" y="42" width="800" height="1695" rx="54" />
    </clipPath>
  </defs>

  <!-- Side Buttons (Power, Volume) -->
  <rect x="18" y="320" width="8" height="96" rx="4" fill="#334155" />
  <rect x="18" y="440" width="8" height="140" rx="4" fill="#334155" />
  <rect x="18" y="600" width="8" height="140" rx="4" fill="#334155" />
  <rect x="858" y="420" width="8" height="180" rx="4" fill="#334155" />

  <!-- Outer Phone Body -->
  <rect x="24" y="24" width="836" height="1731" rx="64" fill="url(#bodyBezel)" stroke="url(#rimMetal)" stroke-width="4" filter="url(#phoneShadow)" />

  <!-- Screen Container with Clip -->
  <g clip-path="url(#screenClip)">
    <!-- Screen Background -->
    <rect x="42" y="42" width="800" height="1695" fill="#F7FAF9" />

    <!-- Status Bar -->
    <g transform="translate(42, 42)">
      <!-- Dynamic Island / Speaker Pill -->
      <rect x="280" y="20" width="240" height="44" rx="22" fill="#000000" />
      <circle cx="475" cy="42" r="7" fill="#1E293B" />
      <circle cx="475" cy="42" r="3.5" fill="#0284C7" opacity="0.6" />
      <rect x="330" y="38" width="60" height="8" rx="4" fill="#1E293B" />

      <!-- Time -->
      <text x="65" y="52" font-family="'Inter', -apple-system, sans-serif" font-size="24" font-weight="700" fill="#16212E">9:41</text>

      <!-- Status Icons -->
      <g transform="translate(680, 36)" fill="#16212E">
        <!-- Signal -->
        <rect x="0" y="16" width="4.5" height="6" rx="1.5"/>
        <rect x="7" y="12" width="4.5" height="10" rx="1.5"/>
        <rect x="14" y="8" width="4.5" height="14" rx="1.5"/>
        <rect x="21" y="3" width="4.5" height="19" rx="1.5"/>
        <!-- Wifi -->
        <path d="M42 6 C48 1 56 1 62 6 M45 11 C49 7 55 7 59 11 M48 16 C51 13 53 13 56 16 M52 20 A 2 2 0 1 1 52.01 20" stroke="#16212E" stroke-width="2.5" stroke-linecap="round" fill="none"/>
        <!-- Battery -->
        <rect x="72" y="5" width="30" height="16" rx="4" fill="none" stroke="#16212E" stroke-width="2.5"/>
        <rect x="75" y="8" width="20" height="10" rx="2" fill="#16212E"/>
        <path d="M103 10 C104.5 10 105 11 105 13 C105 15 104.5 16 103 16" fill="#16212E"/>
      </g>
    </g>

    <!-- Scrollable Content Area -->
    <g transform="translate(72, 130)">
      
      <!-- Top Header -->
      <g transform="translate(0, 0)">
        <text x="0" y="24" font-family="'Inter', sans-serif" font-size="20" font-weight="500" fill="#5C6773">Good morning</text>
        <text x="0" y="65" font-family="'Inter Tight', 'Inter', sans-serif" font-size="36" font-weight="800" fill="#16212E">Hi, Ayaan</text>
        
        <!-- Avatar Button -->
        <g transform="translate(660, 4)">
          <rect width="80" height="80" rx="40" fill="url(#avatarGrad)" />
          <!-- User Icon -->
          <circle cx="40" cy="30" r="14" fill="#ffffff" />
          <path d="M22 62 C22 48 30 46 40 46 C50 46 58 48 58 62 Z" fill="#ffffff" />
        </g>
      </g>

      <!-- Pairing Banner -->
      <g transform="translate(0, 110)">
        <rect width="740" height="74" rx="22" fill="#E2F3F1" stroke="#2D8B8B" stroke-width="1.5" stroke-opacity="0.3" />
        <!-- NFC icon -->
        <g transform="translate(26, 23)" stroke="#206E6E" stroke-width="2.5" fill="none">
          <rect x="0" y="0" width="20" height="28" rx="4" />
          <path d="M7 10 A 3 3 0 0 1 13 10 M5 14 A 6 6 0 0 1 15 14" stroke-linecap="round"/>
        </g>
        <text x="65" y="44" font-family="'Inter', sans-serif" font-size="19" font-weight="600" fill="#206E6E">New device? Tap to pair it with your family</text>
        <path d="M700 32 L708 37 L700 42" stroke="#206E6E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </g>

      <!-- Hero Card: Active Protection Quote -->
      <g transform="translate(0, 210)">
        <rect width="740" height="340" rx="36" fill="url(#heroCardGrad)" />
        <!-- Ambient decorative glow -->
        <circle cx="680" cy="280" r="160" fill="url(#glowOrb)" />
        
        <!-- Badge: Active Protection -->
        <g transform="translate(32, 32)">
          <rect width="200" height="42" rx="21" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1" />
          <circle cx="24" cy="21" r="5" fill="#34D399" />
          <text x="40" y="27" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#E2F3F1" letter-spacing="0.5">ACTIVE PROTECTION</text>
        </g>

        <!-- Shield Icon Right -->
        <g transform="translate(650, 32)">
          <rect width="52" height="52" rx="26" fill="#ffffff" fill-opacity="0.12" />
          <path d="M662 14 L676 8 L690 14 C690 28 676 36 676 36 C676 36 662 28 662 14 Z" transform="translate(-650, 4)" stroke="#8FCBC7" stroke-width="2.5" fill="none"/>
          <path d="M21 27 L25 31 L32 22" stroke="#34D399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        </g>

        <!-- Main Quote -->
        <text x="32" y="130" font-family="'Inter Tight', 'Inter', sans-serif" font-size="28" font-weight="800" fill="#ffffff">
          “We’re protecting your child every step of the way.”
        </text>
        
        <text x="32" y="180" font-family="'Inter', sans-serif" font-size="18" font-weight="400" fill="#ffffff" fill-opacity="0.8" width="670">
          Keeping every digital journey safe, balanced, and positive so your child can
        </text>
        <text x="32" y="210" font-family="'Inter', sans-serif" font-size="18" font-weight="400" fill="#ffffff" fill-opacity="0.8">
          explore, learn, and grow with total peace of mind.
        </text>

        <!-- Divider -->
        <line x1="32" y1="250" x2="708" y2="250" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1" />

        <!-- Sub badges -->
        <g transform="translate(32, 285)" fill="#E2F3F1" font-family="'Inter', sans-serif" font-size="17" font-weight="600">
          <circle cx="8" cy="-4" r="7" fill="#34D399" />
          <path d="M5 -4 L7 -2 L11 -6" stroke="#16212E" stroke-width="1.8" stroke-linecap="round" fill="none"/>
          <text x="24" y="0">Safe Browsing</text>

          <g transform="translate(250, 0)">
            <circle cx="8" cy="-4" r="7" fill="#34D399" />
            <path d="M5 -4 L7 -2 L11 -6" stroke="#16212E" stroke-width="1.8" stroke-linecap="round" fill="none"/>
            <text x="24" y="0">Smart Filter</text>
          </g>

          <g transform="translate(480, 0)">
            <circle cx="8" cy="-4" r="7" fill="#34D399" />
            <path d="M5 -4 L7 -2 L11 -6" stroke="#16212E" stroke-width="1.8" stroke-linecap="round" fill="none"/>
            <text x="24" y="0">Family Linked</text>
          </g>
        </g>
      </g>

      <!-- Compliance Habits Streak Card -->
      <g transform="translate(0, 580)">
        <rect width="740" height="180" rx="32" fill="#ffffff" stroke="#DCE6E4" stroke-width="1.5" />
        
        <g transform="translate(28, 30)">
          <!-- Shield Check -->
          <circle cx="16" cy="14" r="16" fill="#E1F0E9" />
          <path d="M11 14 L15 18 L22 10" stroke="#4C9A7D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          <text x="44" y="21" font-family="'Inter Tight', 'Inter', sans-serif" font-size="22" font-weight="700" fill="#16212E">You're doing great today</text>
        </g>

        <!-- Badge 4/5 habits -->
        <g transform="translate(585, 30)">
          <rect width="125" height="36" rx="18" fill="#E1F0E9" />
          <text x="62" y="24" text-anchor="middle" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#2F6B52">4/5 habits</text>
        </g>

        <!-- Progress Track -->
        <g transform="translate(28, 86)">
          <rect width="684" height="16" rx="8" fill="#E2F3F1" />
          <rect width="547" height="16" rx="8" fill="url(#progressGrad)" />
        </g>

        <!-- Bottom streak text -->
        <g transform="translate(28, 142)">
          <!-- Flame icon -->
          <path d="M10 2 C10 8 16 10 16 16 C16 20 12 24 8 24 C4 24 0 20 0 16 C0 10 6 6 10 2 Z" fill="#B8903C" transform="translate(0, -18) scale(0.8)"/>
          <text x="24" y="0" font-family="'Inter', sans-serif" font-size="17" font-weight="500" fill="#5C6773">No rule-breaks today — 6-day streak</text>
          
          <text x="684" y="0" text-anchor="end" font-family="'Inter', sans-serif" font-size="18" font-weight="700" fill="#2D8B8B">View →</text>
        </g>
      </g>

      <!-- Family Message Card -->
      <g transform="translate(0, 785)">
        <rect width="740" height="120" rx="30" fill="#E2F3F1" stroke="#2D8B8B" stroke-width="1.5" stroke-opacity="0.2" />
        
        <!-- Heart Avatar -->
        <g transform="translate(26, 24)">
          <rect width="72" height="72" rx="24" fill="#ffffff" />
          <path d="M36 48 C20 36 20 24 28 20 C34 16 36 22 36 22 C36 22 38 16 44 20 C52 24 52 36 36 48 Z" fill="#BD5B52"/>
        </g>

        <!-- Message Details -->
        <text x="120" y="52" font-family="'Inter', sans-serif" font-size="20" font-weight="700" fill="#16212E">Mom sent you a message</text>
        <text x="120" y="82" font-family="'Inter', sans-serif" font-size="17" font-weight="500" fill="#5C6773">“Good luck with your test today, superstar!”</text>

        <!-- Reply Button -->
        <text x="680" y="68" text-anchor="end" font-family="'Inter', sans-serif" font-size="19" font-weight="700" fill="#2D8B8B">Reply</text>
      </g>

      <!-- Device Protection Status Card -->
      <g transform="translate(0, 930)">
        <rect width="740" height="240" rx="32" fill="#ffffff" stroke="#DCE6E4" stroke-width="1.5" />
        
        <g transform="translate(28, 28)">
          <!-- Shield Icon -->
          <rect width="64" height="64" rx="20" fill="#E2F3F1" stroke="#2D8B8B" stroke-width="1.5" stroke-opacity="0.3"/>
          <path d="M32 16 L44 21 L44 33 C44 43 32 49 32 49 C32 49 20 43 20 33 L20 21 Z" fill="none" stroke="#2D8B8B" stroke-width="2.5"/>

          <text x="84" y="28" font-family="'Inter Tight', 'Inter', sans-serif" font-size="17" font-weight="800" fill="#16212E" letter-spacing="1">DEVICE PROTECTION STATUS</text>
          <text x="84" y="54" font-family="'Inter', sans-serif" font-size="16" font-weight="500" fill="#5C6773">All parental safety rules are actively guarding this device.</text>

          <!-- Safe Pill -->
          <g transform="translate(580, 6)">
            <rect width="100" height="36" rx="18" fill="#E1F0E9" />
            <circle cx="22" cy="18" r="4.5" fill="#4C9A7D" />
            <text x="56" y="24" font-family="'Inter', sans-serif" font-size="16" font-weight="800" fill="#2F6B52">Safe</text>
          </g>
        </g>

        <!-- Divider -->
        <line x1="28" y1="120" x2="712" y2="120" stroke="#DCE6E4" stroke-width="1.2" />

        <!-- 4 Grid Items -->
        <g transform="translate(28, 145)" font-family="'Inter', sans-serif" font-size="17" font-weight="500" fill="#5C6773">
          <!-- Col 1 -->
          <g transform="translate(10, 20)">
            <circle cx="10" cy="-4" r="8" fill="#E1F0E9"/>
            <path d="M7 -4 L9 -2 L13 -6" stroke="#2F6B52" stroke-width="2" stroke-linecap="round" fill="none"/>
            <text x="28" y="0">Safe Web Filtering</text>
          </g>
          <g transform="translate(10, 60)">
            <circle cx="10" cy="-4" r="8" fill="#E1F0E9"/>
            <path d="M7 -4 L9 -2 L13 -6" stroke="#2F6B52" stroke-width="2" stroke-linecap="round" fill="none"/>
            <text x="28" y="0">Location Sharing On</text>
          </g>
          <!-- Col 2 -->
          <g transform="translate(360, 20)">
            <circle cx="10" cy="-4" r="8" fill="#E1F0E9"/>
            <path d="M7 -4 L9 -2 L13 -6" stroke="#2F6B52" stroke-width="2" stroke-linecap="round" fill="none"/>
            <text x="28" y="0">App Approvals Active</text>
          </g>
          <g transform="translate(360, 60)">
            <circle cx="10" cy="-4" r="8" fill="#E1F0E9"/>
            <path d="M7 -4 L9 -2 L13 -6" stroke="#2F6B52" stroke-width="2" stroke-linecap="round" fill="none"/>
            <text x="28" y="0">SOS Emergency Ready</text>
          </g>
        </g>
      </g>

    </g>

    <!-- Bottom Tab Bar -->
    <g transform="translate(42, 1550)">
      <rect width="800" height="140" fill="#ffffff" stroke="#DCE6E4" stroke-width="1" />

      <!-- Home Tab -->
      <g transform="translate(80, 25)" text-anchor="middle">
        <path d="M0 10 L15 -2 L30 10 L30 28 L0 28 Z" fill="#2D8B8B" />
        <text x="15" y="48" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#2D8B8B">Home</text>
      </g>

      <!-- Time Tab -->
      <g transform="translate(230, 25)" text-anchor="middle">
        <circle cx="15" cy="14" r="14" fill="none" stroke="#5C6773" stroke-width="2.5" />
        <path d="M15 6 L15 14 L21 17" stroke="#5C6773" stroke-width="2" stroke-linecap="round" fill="none"/>
        <text x="15" y="48" font-family="'Inter', sans-serif" font-size="16" font-weight="600" fill="#5C6773">Time</text>
      </g>

      <!-- Glowing Center SOS Tab -->
      <g transform="translate(400, 20)">
        <circle cx="0" cy="10" r="44" fill="url(#sosGrad)" filter="drop-shadow(0 8px 16px rgba(239,68,68,0.4))" />
        <text x="0" y="18" text-anchor="middle" font-family="'Inter Tight', 'Inter', sans-serif" font-size="24" font-weight="900" fill="#ffffff" letter-spacing="1">SOS</text>
      </g>

      <!-- Games Tab -->
      <g transform="translate(540, 25)" text-anchor="middle">
        <rect x="0" y="2" width="30" height="20" rx="6" fill="none" stroke="#5C6773" stroke-width="2.5" />
        <path d="M6 12 H12 M9 9 V15 M20 10 H22 M20 14 H22" stroke="#5C6773" stroke-width="2.5" stroke-linecap="round"/>
        <text x="15" y="48" font-family="'Inter', sans-serif" font-size="16" font-weight="600" fill="#5C6773">Games</text>
      </g>

      <!-- Chat Tab -->
      <g transform="translate(680, 25)" text-anchor="middle">
        <path d="M4 4 H26 C28 4 30 6 30 8 V20 C30 22 28 24 26 24 H12 L4 28 V8 C4 6 6 4 8 4 Z" fill="none" stroke="#5C6773" stroke-width="2.5"/>
        <text x="17" y="48" font-family="'Inter', sans-serif" font-size="16" font-weight="600" fill="#5C6773">Chat</text>
      </g>

      <!-- Bottom Home Indicator Bar -->
      <rect x="290" y="95" width="220" height="6" rx="3" fill="#16212E" />
    </g>

    <!-- Glass Reflection Specular Highlight -->
    <path d="M42 42 L650 42 L42 1200 Z" fill="url(#screenGlassSheen)" pointer-events="none" />
  </g>
</svg>
