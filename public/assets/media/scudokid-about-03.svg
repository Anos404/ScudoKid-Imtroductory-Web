<svg width="457" height="948" viewBox="0 0 457 948" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bodyBezelA3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D3748" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="aiHeaderA3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <clipPath id="screenA3">
      <rect x="22" y="22" width="413" height="904" rx="36" />
    </clipPath>
  </defs>

  <!-- Phone Frame -->
  <rect x="12" y="12" width="433" height="924" rx="42" fill="url(#bodyBezelA3)" stroke="#475569" stroke-width="2.5" />
  
  <g clip-path="url(#screenA3)">
    <rect x="22" y="22" width="413" height="904" fill="#0F172A" />
    
    <!-- Status Bar (Dark mode) -->
    <rect x="150" y="32" width="157" height="24" rx="12" fill="#000000" />
    <text x="56" y="50" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#ffffff">9:41</text>
    <circle cx="380" cy="46" r="4" fill="#34D399" />

    <!-- AI Intelligence Header -->
    <g transform="translate(42, 70)">
      <rect width="373" height="120" rx="20" fill="url(#aiHeaderA3)" />
      <text x="24" y="32" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#A7F3D0" letter-spacing="1">AI BEHAVIOR ANALYSIS ENGINE</text>
      <text x="24" y="64" font-family="'Inter', sans-serif" font-size="22" font-weight="800" fill="#ffffff">Isolation Forest ML</text>
      <text x="24" y="94" font-family="'Inter', sans-serif" font-size="13" font-weight="500" fill="#E2E8F0">Python · Scikit-learn · Gemma4</text>
    </g>

    <!-- 7-Day Rolling Baseline Graph -->
    <g transform="translate(42, 205)">
      <rect width="373" height="190" rx="18" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
      <text x="20" y="30" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#94A3B8">7-DAY SCREEN TIME BASELINE</text>
      
      <!-- Normal curve & outlier spike -->
      <g transform="translate(20, 50)">
        <!-- Grid lines -->
        <line x1="0" y1="20" x2="333" y2="20" stroke="#334155" stroke-dasharray="3 3"/>
        <line x1="0" y1="60" x2="333" y2="60" stroke="#334155" stroke-dasharray="3 3"/>
        <line x1="0" y1="95" x2="333" y2="95" stroke="#334155"/>

        <!-- 7 bars / line -->
        <path d="M 15 75 Q 60 70 100 75 T 180 72 T 240 70 L 290 15" stroke="#34D399" stroke-width="3" fill="none" />
        <circle cx="290" cy="15" r="6" fill="#EF4444" stroke="#ffffff" stroke-width="2" />

        <!-- Anomaly tag -->
        <rect x="235" y="-12" width="95" height="22" rx="6" fill="#EF4444" />
        <text x="282" y="3" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" font-weight="800" fill="#ffffff">&gt;2σ DEVIATION</text>

        <!-- X labels -->
        <g fill="#64748B" font-family="'Inter', sans-serif" font-size="10" transform="translate(0, 112)">
          <text x="10" y="0">Mon</text>
          <text x="55" y="0">Tue</text>
          <text x="100" y="0">Wed</text>
          <text x="150" y="0">Thu</text>
          <text x="200" y="0">Fri</text>
          <text x="245" y="0">Sat</text>
          <text x="280" y="0" fill="#EF4444" font-weight="700">Sun Spike</text>
        </g>
      </g>
    </g>

    <!-- Addiction Detection Metric -->
    <g transform="translate(42, 410)">
      <rect width="373" height="150" rx="18" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
      <text x="20" y="30" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#94A3B8">ADDICTION QUANTIFICATION (0–100)</text>

      <text x="20" y="74" font-family="'Inter', sans-serif" font-size="34" font-weight="900" fill="#34D399">18<tspan font-size="18" font-weight="500" fill="#64748B">/100 (Safe Level)</tspan></text>
      
      <!-- 4 formula factors -->
      <g transform="translate(20, 95)" font-family="'Inter', sans-serif" font-size="11" fill="#CBD5E1">
        <text x="0" y="12">🌙 Night Ratio: <tspan fill="#34D399" font-weight="700">Low (0.04)</tspan></text>
        <text x="170" y="12">⏱ Session Len: <tspan fill="#34D399" font-weight="700">22 min avg</tspan></text>
        <text x="0" y="32">⚡ App Switch: <tspan fill="#34D399" font-weight="700">Normal</tspan></text>
        <text x="170" y="32">🔄 Daily Freq: <tspan fill="#34D399" font-weight="700">5 sessions</tspan></text>
      </g>
    </g>

    <!-- Smart 3-Tier Alert Output -->
    <g transform="translate(42, 575)">
      <rect width="373" height="195" rx="18" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
      <text x="20" y="28" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#94A3B8">SMART ALERT CLASSIFICATION</text>

      <g transform="translate(20, 42)">
        <!-- Informational -->
        <rect width="333" height="38" rx="8" fill="#0F172A" stroke="#1E293B" />
        <circle cx="18" cy="19" r="5" fill="#3B82F6" />
        <text x="32" y="23" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#93C5FD">INFO:</text>
        <text x="74" y="23" font-family="'Inter', sans-serif" font-size="11" fill="#E2E8F0">Daily limit 100% reached (Dashboard only)</text>

        <!-- Warning -->
        <rect y="46" width="333" height="38" rx="8" fill="#0F172A" stroke="#1E293B" />
        <circle cx="18" cy="65" r="5" fill="#F59E0B" />
        <text x="32" y="69" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#FDE68A">WARN:</text>
        <text x="78" y="69" font-family="'Inter', sans-serif" font-size="11" fill="#E2E8F0">Geo-fence exit: School perimeter (Push sent)</text>

        <!-- Critical -->
        <rect y="92" width="333" height="46" rx="8" fill="#450A0A" stroke="#B91C1C" />
        <circle cx="18" cy="115" r="6" fill="#EF4444" />
        <text x="32" y="119" font-family="'Inter', sans-serif" font-size="12" font-weight="800" fill="#FCA5A5">CRITICAL:</text>
        <text x="96" y="119" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#ffffff">One-tap SOS broadcast + SMS sent</text>
      </g>
    </g>

    <!-- Bottom Nav -->
    <g transform="translate(22, 850)">
      <rect width="413" height="76" fill="#0F172A" stroke="#334155" stroke-width="1" />
      <rect x="156" y="44" width="100" height="4" rx="2" fill="#334155" />
      <text x="80" y="26" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#64748B">Telemetry</text>
      <text x="206" y="26" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#34D399">ML Models</text>
      <text x="330" y="26" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#64748B">Alerts</text>
    </g>
  </g>
</svg>
