<svg width="600" height="900" viewBox="0 0 600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Outer Phone Shadow -->
    <filter id="phone-shadow" x="40" y="20" width="520" height="860" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#000000" flood-opacity="0.55"/>
    </filter>

    <!-- Phone Bezel / Titanium Frame Gradient -->
    <linearGradient id="body-grad" x1="100" y1="50" x2="500" y2="850" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Splash Screen Deep Emerald-Teal Gradient -->
    <linearGradient id="splash-bg" x1="300" y1="66" x2="300" y2="834" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#041414"/>
      <stop offset="35%" stop-color="#092525"/>
      <stop offset="70%" stop-color="#0F3836"/>
      <stop offset="100%" stop-color="#1A4F4F"/>
    </linearGradient>

    <!-- Ambient Center Glow for Splash Emblem -->
    <radialGradient id="splash-glow" cx="300" cy="410" r="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2D8B8B" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#34D399" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Shield Gradient -->
    <linearGradient id="shield-grad" x1="260" y1="310" x2="340" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="40%" stop-color="#2D8B8B"/>
      <stop offset="100%" stop-color="#164E4D"/>
    </linearGradient>

    <!-- Glass Highlights on Frame -->
    <linearGradient id="glass-reflection" x1="116" y1="66" x2="350" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Outer Phone Body with Soft Drop Shadow -->
  <g filter="url(#phone-shadow)">
    <rect x="100" y="50" width="400" height="800" rx="50" fill="url(#body-grad)" stroke="#475569" stroke-width="5"/>
  </g>

  <!-- Inner Phone Screen Area -->
  <rect x="116" y="66" width="368" height="768" rx="40" fill="url(#splash-bg)"/>

  <!-- Screen Glass Reflection Layer -->
  <rect x="116" y="66" width="368" height="768" rx="40" fill="url(#glass-reflection)"/>

  <!-- Dynamic Island Pill (Camera + Sensors) -->
  <rect x="235" y="80" width="130" height="28" rx="14" fill="#000000"/>
  <circle cx="338" cy="94" r="5" fill="#1E293B"/>
  <rect x="256" y="91" width="44" height="6" rx="3" fill="#1E293B"/>

  <!-- Top Status Bar -->
  <text x="150" y="100" fill="#E2E8F0" font-family="'Inter', -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="-0.01em">9:41</text>
  <g transform="translate(422, 89)" fill="#E2E8F0">
    <!-- Cellular Signal -->
    <path d="M0 9 h2.5 v2 H0 z M4 7 h2.5 v4 H4 z M8 4.5 h2.5 v6.5 H8 z M12 2 h2.5 v9 H12 z" />
    <!-- Wifi -->
    <path d="M19 10.5 a2 2 0 0 1 2 -2 a2 2 0 0 1 2 2" stroke="#E2E8F0" stroke-width="1.4" fill="none" stroke-linecap="round"/>
    <!-- Battery -->
    <rect x="26" y="2" width="18" height="9" rx="2.5" fill="none" stroke="#E2E8F0" stroke-width="1.3"/>
    <rect x="28" y="4" width="11" height="5" rx="1" fill="#34D399"/>
    <rect x="44.5" y="5" width="1.5" height="3" rx="0.75" fill="#E2E8F0"/>
  </g>

  <!-- SPLASH SCREEN CENTER CONTENT -->
  <!-- Ambient Center Glow Aura -->
  <circle cx="300" cy="410" r="170" fill="url(#splash-glow)"/>

  <!-- Decorative Orbit Rings -->
  <circle cx="300" cy="380" r="95" stroke="#34D399" stroke-opacity="0.15" stroke-width="1.5" stroke-dasharray="6 6"/>
  <circle cx="300" cy="380" r="125" stroke="#2D8B8B" stroke-opacity="0.10" stroke-width="1"/>

  <!-- ScudoKid Emblem Crest -->
  <g transform="translate(250, 320)">
    <!-- Shield Outer Shell -->
    <path d="M50 4 L88 18 C88 60 50 90 50 96 C50 90 12 60 12 18 L50 4 Z" fill="url(#shield-grad)" stroke="#34D399" stroke-width="3" stroke-linejoin="round"/>
    
    <!-- Shield Inner Facet -->
    <path d="M50 14 L78 24 C78 56 50 80 50 84 C50 80 22 56 22 24 L50 14 Z" fill="#ffffff" fill-opacity="0.15"/>

    <!-- Parent Protective Hug Curves -->
    <path d="M26 40 C30 28 40 25 50 25 C60 25 70 28 74 40" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <circle cx="34" cy="23" r="5" fill="#ffffff"/>
    <circle cx="66" cy="23" r="5" fill="#ffffff"/>

    <!-- Joyful Protected Child in Center -->
    <circle cx="50" cy="44" r="7" fill="#FBBF24"/>
    <path d="M38 54 L50 61 L62 54 M50 61 L50 74 M41 84 L50 74 L59 84" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Brand Wordmark -->
  <g transform="translate(300, 475)">
    <text text-anchor="middle" font-family="'Host Grotesk', 'Inter', sans-serif" font-size="34" font-weight="800" letter-spacing="-0.02em" fill="#ffffff">
      Scudo<tspan fill="#34D399">Kid</tspan>
    </text>
    <text y="24" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="700" letter-spacing="0.16em" fill="#A7F3D0">
      CHILD APPLICATION
    </text>
    <text y="46" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#94A3B8">
      Proactive Protection &amp; Habit Coaching
    </text>
  </g>

  <!-- Splash Screen Loading / Ready Indicator -->
  <g transform="translate(300, 680)">
    <!-- 3 Glowing Pulse Dots -->
    <circle cx="-16" cy="0" r="4.5" fill="#34D399" opacity="0.9"/>
    <circle cx="0" cy="0" r="4.5" fill="#2D8B8B" opacity="0.6"/>
    <circle cx="16" cy="0" r="4.5" fill="#2D8B8B" opacity="0.3"/>
    
    <text y="26" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10.5" font-weight="600" letter-spacing="0.08em" fill="#64748B">
      STARTING TELEMETRY SERVICE...
    </text>
    <text y="44" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9.5" font-weight="500" fill="#475569">
      ScudoKid Core v1.0.0
    </text>
  </g>

  <!-- Mobile Home Indicator Bar (Swipe Bar) -->
  <rect x="235" y="810" width="130" height="4.5" rx="2.25" fill="#ffffff" fill-opacity="0.45"/>
</svg>
