<svg width="600" height="900" viewBox="0 0 600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="phone-shadow" x="50" y="30" width="500" height="840" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="25" stdDeviation="35" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="body-grad" x1="100" y1="50" x2="500" y2="850" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#1E293B"/>
      <stop offset="100%" stopColor="#0F172A"/>
    </linearGradient>
    <linearGradient id="screen-grad" x1="120" y1="80" x2="480" y2="820" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#0B2323"/>
      <stop offset="40%" stopColor="#164E4D"/>
      <stop offset="100%" stopColor="#2D8B8B"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="150" y1="260" x2="450" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#1A4F4F"/>
      <stop offset="100%" stopColor="#206E6E"/>
    </linearGradient>
  </defs>

  <!-- Outer Phone Body with Shadow -->
  <g filter="url(#phone-shadow)">
    <rect x="100" y="50" width="400" height="800" rx="48" fill="url(#body-grad)" stroke="#334155" stroke-width="6"/>
  </g>

  <!-- Inner Screen -->
  <rect x="116" y="66" width="368" height="768" rx="38" fill="url(#screen-grad)"/>

  <!-- Speaker & Camera Dynamic Island -->
  <rect x="235" y="80" width="130" height="26" rx="13" fill="#020617"/>
  <circle cx="340" cy="93" r="5" fill="#1E293B"/>
  <rect x="255" y="90" width="45" height="5" rx="2.5" fill="#1E293B"/>

  <!-- Status Bar -->
  <text x="145" y="98" fill="#FFFFFF" font-family="'Inter Tight', sans-serif" font-size="13" font-weight="700">9:41</text>
  <g transform="translate(425, 87)" fill="#FFFFFF">
    <path d="M0 8h3v3H0zM4 6h3v5H4zM8 3h3v8H8zM12 0h3v11h-3z" opacity="0.9"/>
    <rect x="20" y="1" width="18" height="9" rx="2" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
    <rect x="22" y="3" width="11" height="5" rx="1" fill="#10B981"/>
  </g>

  <!-- Child App Header -->
  <g transform="translate(140, 130)">
    <text x="0" y="15" fill="#A7F3D0" font-family="'Inter', sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">GOOD MORNING</text>
    <text x="0" y="42" fill="#FFFFFF" font-family="'Inter Tight', sans-serif" font-size="24" font-weight="800">Hi, Ayaan</text>
    <circle cx="290" cy="24" r="22" fill="#2D8B8B" stroke="#A7F3D0" stroke-width="2"/>
    <circle cx="290" cy="18" r="7" fill="#FFFFFF"/>
    <path d="M276 36c0-6 6-9 14-9s14 3 14 9" fill="#FFFFFF"/>
  </g>

  <!-- Active Protection Card -->
  <g transform="translate(140, 205)">
    <rect x="0" y="0" width="320" height="180" rx="24" fill="url(#card-grad)" stroke="#34D399" stroke-width="1.5" stroke-opacity="0.4"/>
    <rect x="18" y="18" width="135" height="26" rx="13" fill="#0D2626" fill-opacity="0.6"/>
    <circle cx="32" cy="31" r="4" fill="#34D399"/>
    <text x="44" y="35" fill="#34D399" font-family="'Inter', sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">ACTIVE PROTECTION</text>

    <!-- Shield Icon -->
    <path d="M285 24l-15 6v14c0 10 7 19 15 22 8-3 15-12 15-22V30l-15-6z" fill="#34D399" fill-opacity="0.2" stroke="#34D399" stroke-width="2"/>
    <path d="M280 43l4 4 8-8" stroke="#34D399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Quote -->
    <text x="18" y="80" fill="#FFFFFF" font-family="'Inter Tight', sans-serif" font-size="16" font-weight="700">“Protecting every step</text>
    <text x="18" y="102" fill="#FFFFFF" font-family="'Inter Tight', sans-serif" font-size="16" font-weight="700">of your digital journey.”</text>
    <text x="18" y="128" fill="#D1FAE5" font-family="'Inter', sans-serif" font-size="11" opacity="0.85">Safe web filtering • Habit tracking • SOS ready</text>

    <!-- Progress Line -->
    <rect x="18" y="148" width="284" height="6" rx="3" fill="#0D2626" fill-opacity="0.5"/>
    <rect x="18" y="148" width="227" height="6" rx="3" fill="#34D399"/>
  </g>

  <!-- Habit Streak Status Card -->
  <g transform="translate(140, 405)">
    <rect x="0" y="0" width="320" height="95" rx="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <circle cx="32" cy="35" r="14" fill="#E2F3F1"/>
    <path d="M28 35l3 3 6-6" stroke="#2D8B8B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="56" y="32" fill="#0F172A" font-family="'Inter Tight', sans-serif" font-size="14" font-weight="700">Daily Digital Habits</text>
    <text x="56" y="48" fill="#64748B" font-family="'Inter', sans-serif" font-size="11">4 of 5 daily goals achieved</text>
    <rect x="235" y="24" width="70" height="22" rx="11" fill="#E2F3F1"/>
    <text x="270" y="39" fill="#1A4F4F" font-family="'Inter', sans-serif" font-size="10" font-weight="700" text-anchor="middle">6-DAY STREAK</text>
    <!-- Progress bar -->
    <rect x="20" y="70" width="280" height="6" rx="3" fill="#F1F5F9"/>
    <rect x="20" y="70" width="224" height="6" rx="3" fill="#2D8B8B"/>
  </g>

  <!-- Family Message Card -->
  <g transform="translate(140, 520)">
    <rect x="0" y="0" width="320" height="85" rx="20" fill="#E2F3F1" stroke="#2D8B8B" stroke-opacity="0.3" stroke-width="1"/>
    <rect x="18" y="18" width="48" height="48" rx="14" fill="#FFFFFF"/>
    <path d="M42 35c0-4-3-7-7-7s-7 3-7 7c0 6 7 11 7 11s7-5 7-11z" fill="#EF4444"/>
    <text x="78" y="36" fill="#0F172A" font-family="'Inter Tight', sans-serif" font-size="13" font-weight="700">Mom sent you a note</text>
    <text x="78" y="52" fill="#475569" font-family="'Inter', sans-serif" font-size="11">“Have a wonderful day, superstar!”</text>
  </g>

  <!-- Mini Game Reward Card -->
  <g transform="translate(140, 625)">
    <rect x="0" y="0" width="320" height="85" rx="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="18" y="18" width="48" height="48" rx="14" fill="#FEF3C7"/>
    <!-- Game Controller Icon -->
    <path d="M34 36h16M42 28v16" stroke="#D97706" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="50" cy="46" r="2" fill="#D97706"/>
    <text x="78" y="36" fill="#0F172A" font-family="'Inter Tight', sans-serif" font-size="13" font-weight="700">Flappy Bird &amp; Tic-Tac-Toe</text>
    <text x="78" y="52" fill="#10B981" font-family="'Inter', sans-serif" font-size="11" font-weight="600">✓ Unlocked for today&apos;s good habits</text>
  </g>

  <!-- Bottom Navigation Bar with Center SOS Button -->
  <g transform="translate(140, 740)">
    <rect x="0" y="0" width="320" height="70" rx="24" fill="#0F172A"/>
    <!-- Home Tab -->
    <circle cx="45" cy="30" r="16" fill="#2D8B8B"/>
    <path d="M40 33l5-4 5 4v6h-10z" fill="#FFFFFF"/>
    <text x="45" y="58" fill="#34D399" font-family="'Inter', sans-serif" font-size="9" font-weight="700" text-anchor="middle">Home</text>
    <!-- Time Tab -->
    <circle cx="105" cy="30" r="14" fill="none" stroke="#64748B" stroke-width="1.5"/>
    <path d="M105 24v6l4 2" stroke="#64748B" stroke-width="1.5" stroke-linecap="round"/>
    <text x="105" y="58" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="9" text-anchor="middle">Time</text>
    <!-- Center Red SOS Button -->
    <circle cx="160" cy="24" r="24" fill="#EF4444" stroke="#0F172A" stroke-width="4"/>
    <path d="M160 14l-8 4v8c0 6 4 10 8 12 4-2 8-6 8-12v-8l-8-4z" fill="#FFFFFF"/>
    <text x="160" y="27" fill="#EF4444" font-family="'Inter Tight', sans-serif" font-size="8" font-weight="900" text-anchor="middle">SOS</text>
    <text x="160" y="58" fill="#EF4444" font-family="'Inter', sans-serif" font-size="9" font-weight="700" text-anchor="middle">SOS</text>
    <!-- Games Tab -->
    <path d="M210 24h10M215 19v10" stroke="#64748B" stroke-width="1.5" stroke-linecap="round"/>
    <text x="215" y="58" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="9" text-anchor="middle">Games</text>
    <!-- Chat Tab -->
    <rect x="268" y="22" width="16" height="12" rx="3" fill="none" stroke="#64748B" stroke-width="1.5"/>
    <text x="276" y="58" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="9" text-anchor="middle">Chat</text>
  </g>
</svg>
