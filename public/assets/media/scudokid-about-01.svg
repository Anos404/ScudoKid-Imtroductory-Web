<svg width="457" height="948" viewBox="0 0 457 948" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bodyBezelA1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D3748" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="parentHeaderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A4F4F" />
      <stop offset="100%" stop-color="#206E6E" />
    </linearGradient>
    <clipPath id="screenA1">
      <rect x="22" y="22" width="413" height="904" rx="36" />
    </clipPath>
  </defs>

  <!-- Phone Frame -->
  <rect x="12" y="12" width="433" height="924" rx="42" fill="url(#bodyBezelA1)" stroke="#475569" stroke-width="2.5" />
  
  <g clip-path="url(#screenA1)">
    <!-- Screen bg -->
    <rect x="22" y="22" width="413" height="904" fill="#F8FAFC" />
    
    <!-- Status Bar -->
    <rect x="150" y="32" width="157" height="24" rx="12" fill="#000000" />
    <text x="56" y="50" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#0F172A">9:41</text>
    <circle cx="380" cy="46" r="4" fill="#10B981" />

    <!-- Parent Portal Header -->
    <g transform="translate(42, 70)">
      <rect width="373" height="130" rx="20" fill="url(#parentHeaderGrad)" />
      <text x="24" y="34" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#A7F3D0" letter-spacing="1">PARENT PORTAL · WEB DASHBOARD</text>
      <text x="24" y="66" font-family="'Inter', sans-serif" font-size="22" font-weight="800" fill="#ffffff">Khan Family Center</text>
      
      <!-- Multi-child switcher -->
      <g transform="translate(24, 82)">
        <rect width="90" height="32" rx="16" fill="#ffffff" />
        <text x="45" y="21" text-anchor="middle" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#1A4F4F">Ayaan (10)</text>

        <rect x="100" y="0" width="85" height="32" rx="16" fill="#ffffff" fill-opacity="0.2" />
        <text x="142" y="21" text-anchor="middle" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#ffffff">Sara (8)</text>

        <rect x="195" y="0" width="75" height="32" rx="16" fill="#ffffff" fill-opacity="0.2" />
        <text x="232" y="21" text-anchor="middle" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#ffffff">+ Add</text>
      </g>
    </g>

    <!-- AI Risk Score Card -->
    <g transform="translate(42, 218)">
      <rect width="373" height="155" rx="18" fill="#ffffff" stroke="#E2E8F0" stroke-width="1.5" />
      <text x="20" y="30" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#64748B" letter-spacing="0.5">AI BEHAVIORAL RISK SCORE</text>
      
      <g transform="translate(270, 16)">
        <rect width="84" height="26" rx="13" fill="#D1FAE5" />
        <circle cx="16" cy="13" r="4" fill="#059669" />
        <text x="48" y="18" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#065F46">LOW RISK</text>
      </g>

      <text x="20" y="76" font-family="'Inter', sans-serif" font-size="36" font-weight="900" fill="#0F172A">94<tspan font-size="20" font-weight="600" fill="#64748B">/100</tspan></text>
      <text x="20" y="104" font-family="'Inter', sans-serif" font-size="13" font-weight="500" fill="#10B981">✓ Healthy balance across screen &amp; study</text>

      <!-- Mini metrics bar -->
      <g transform="translate(20, 122)" font-family="'Inter', sans-serif" font-size="12" fill="#475569">
        <text x="0" y="14">Night Ratio: <tspan font-weight="700" fill="#0F172A">4%</tspan></text>
        <text x="120" y="14">App Switches: <tspan font-weight="700" fill="#0F172A">12/hr</tspan></text>
        <text x="240" y="14">Anomalies: <tspan font-weight="700" fill="#059669">0 flagged</tspan></text>
      </g>
    </g>

    <!-- Real-Time Geo-Fence Status -->
    <g transform="translate(42, 390)">
      <rect width="373" height="210" rx="18" fill="#ffffff" stroke="#E2E8F0" stroke-width="1.5" />
      <text x="20" y="30" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#64748B">LIVE GPS &amp; GEO-FENCING</text>
      
      <!-- Mini Map Illustration -->
      <g transform="translate(20, 48)">
        <rect width="333" height="100" rx="12" fill="#E2E8F0" />
        <!-- Map roads -->
        <path d="M0 50 Q160 20 333 70 M100 0 L140 100 M240 0 L210 100" stroke="#CBD5E1" stroke-width="6" fill="none" />
        <!-- Safe Zone Circle -->
        <circle cx="170" cy="50" r="38" fill="#10B981" fill-opacity="0.25" stroke="#059669" stroke-width="2" stroke-dasharray="4 3" />
        <!-- Pin -->
        <circle cx="170" cy="50" r="7" fill="#2D8B8B" stroke="#ffffff" stroke-width="2.5" />
        <rect x="130" y="12" width="80" height="22" rx="6" fill="#1E293B" />
        <text x="170" y="27" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#ffffff">School Zone</text>
      </g>

      <g transform="translate(20, 168)" font-family="'Inter', sans-serif" font-size="12">
        <text x="0" y="16" font-weight="600" fill="#0F172A">Inside: <tspan fill="#2D8B8B">Sindh University Model School</tspan></text>
        <text x="0" y="32" fill="#64748B">Last telemetry ping: 32 seconds ago (Haversine OK)</text>
      </g>
    </g>

    <!-- Quick Controls -->
    <g transform="translate(42, 616)">
      <rect width="373" height="150" rx="18" fill="#ffffff" stroke="#E2E8F0" stroke-width="1.5" />
      <text x="20" y="30" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#64748B">INSTANT PARENT ACTIONS</text>
      
      <g transform="translate(20, 48)">
        <!-- Instant Lock -->
        <rect width="160" height="74" rx="14" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1" />
        <text x="16" y="30" font-family="'Inter', sans-serif" font-size="14" font-weight="800" fill="#991B1B">Instant Lock</text>
        <text x="16" y="52" font-family="'Inter', sans-serif" font-size="11" fill="#DC2626">Pause device now</text>

        <!-- Web Filter -->
        <rect x="173" y="0" width="160" height="74" rx="14" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1" />
        <text x="189" y="30" font-family="'Inter', sans-serif" font-size="14" font-weight="800" fill="#166534">Safe Filter On</text>
        <text x="189" y="52" font-family="'Inter', sans-serif" font-size="11" fill="#15803D">Adult/threats shielded</text>
      </g>
    </g>

    <!-- Bottom Nav -->
    <g transform="translate(22, 850)">
      <rect width="413" height="76" fill="#ffffff" stroke="#E2E8F0" stroke-width="1" />
      <rect x="156" y="44" width="100" height="4" rx="2" fill="#0F172A" />
      <text x="80" y="26" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#2D8B8B">Dashboard</text>
      <text x="206" y="26" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#64748B">Geofence</text>
      <text x="330" y="26" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#64748B">Reports</text>
    </g>
  </g>
</svg>
