<svg width="457" height="948" viewBox="0 0 457 948" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bodyBezelA2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D3748" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="childHeroA2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A4F4F" />
      <stop offset="50%" stop-color="#206E6E" />
      <stop offset="100%" stop-color="#16212E" />
    </linearGradient>
    <clipPath id="screenA2">
      <rect x="22" y="22" width="413" height="904" rx="36" />
    </clipPath>
  </defs>

  <!-- Phone Frame -->
  <rect x="12" y="12" width="433" height="924" rx="42" fill="url(#bodyBezelA2)" stroke="#475569" stroke-width="2.5" />
  
  <g clip-path="url(#screenA2)">
    <rect x="22" y="22" width="413" height="904" fill="#F7FAF9" />
    
    <!-- Status Bar -->
    <rect x="150" y="32" width="157" height="24" rx="12" fill="#000000" />
    <text x="56" y="50" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#0F172A">9:41</text>
    <circle cx="380" cy="46" r="4" fill="#10B981" />

    <!-- Child App Header -->
    <g transform="translate(42, 70)">
      <text x="0" y="18" font-family="'Inter', sans-serif" font-size="13" font-weight="500" fill="#5C6773">Good morning</text>
      <text x="0" y="44" font-family="'Inter Tight', 'Inter', sans-serif" font-size="24" font-weight="800" fill="#16212E">Hi, Ayaan</text>
      
      <!-- Avatar -->
      <circle cx="340" cy="28" r="22" fill="#2D8B8B" />
      <circle cx="340" cy="22" r="8" fill="#ffffff" />
      <path d="M328 38 C328 32 334 30 340 30 C346 30 352 32 352 38 Z" fill="#ffffff" />
    </g>

    <!-- Active Protection Hero Card -->
    <g transform="translate(42, 130)">
      <rect width="373" height="210" rx="24" fill="url(#childHeroA2)" />
      
      <!-- Badge -->
      <rect x="20" y="20" width="145" height="30" rx="15" fill="#ffffff" fill-opacity="0.14" />
      <circle cx="34" cy="35" r="4" fill="#34D399" />
      <text x="46" y="39" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#E2F3F1">ACTIVE PROTECTION</text>

      <text x="20" y="85" font-family="'Inter Tight', 'Inter', sans-serif" font-size="18" font-weight="800" fill="#ffffff">
        “We’re protecting your child
      </text>
      <text x="20" y="110" font-family="'Inter Tight', 'Inter', sans-serif" font-size="18" font-weight="800" fill="#ffffff">
        every step of the way.”
      </text>

      <text x="20" y="142" font-family="'Inter', sans-serif" font-size="12" font-weight="400" fill="#ffffff" fill-opacity="0.8">
        Keeping digital exploration safe, balanced and positive.
      </text>

      <line x1="20" y1="165" x2="353" y2="165" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1" />
      
      <g transform="translate(20, 190)" fill="#E2F3F1" font-family="'Inter', sans-serif" font-size="11" font-weight="600">
        <text x="0" y="0">✓ Safe Browsing</text>
        <text x="120" y="0">✓ Smart Filter</text>
        <text x="235" y="0">✓ Family Linked</text>
      </g>
    </g>

    <!-- Habit Streaks -->
    <g transform="translate(42, 355)">
      <rect width="373" height="120" rx="20" fill="#ffffff" stroke="#DCE6E4" stroke-width="1.5" />
      <text x="20" y="30" font-family="'Inter Tight', 'Inter', sans-serif" font-size="16" font-weight="700" fill="#16212E">You're doing great today</text>
      <rect x="270" y="16" width="84" height="24" rx="12" fill="#E1F0E9" />
      <text x="312" y="32" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#2F6B52">4/5 habits</text>

      <!-- Progress -->
      <rect x="20" y="55" width="333" height="10" rx="5" fill="#E2F3F1" />
      <rect x="20" y="55" width="266" height="10" rx="5" fill="#2D8B8B" />

      <text x="20" y="92" font-family="'Inter', sans-serif" font-size="12" fill="#5C6773">🔥 No rule-breaks today — 6-day streak</text>
      <text x="353" y="92" text-anchor="end" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#2D8B8B">View →</text>
    </g>

    <!-- AI Reward Games Unlocked Card -->
    <g transform="translate(42, 490)">
