      <text x="20" y="30" font-family="'Inter Tight', 'Inter', sans-serif" font-size="15" font-weight="800" fill="#16212E">AI REWARD MINI-GAMES</text>
      <rect x="250" y="16" width="104" height="24" rx="12" fill="#FEF3C7" />
      <text x="302" y="32" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#92400E">★ 20m Unlocked</text>

      <!-- Two games -->
      <g transform="translate(20, 52)">
        <rect width="158" height="88" rx="14" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1" />
        <text x="16" y="34" font-family="'Inter', sans-serif" font-size="14" font-weight="800" fill="#15803D">Flappy Bird</text>
        <text x="16" y="54" font-family="'Inter', sans-serif" font-size="11" fill="#166534">Reward Game 1</text>
        <text x="16" y="74" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#059669">Play Now →</text>
      </g>

      <g transform="translate(195, 52)">
        <rect width="158" height="88" rx="14" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1" />
        <text x="16" y="34" font-family="'Inter', sans-serif" font-size="14" font-weight="800" fill="#1D4ED8">Tic Tac Toe</text>
        <text x="16" y="54" font-family="'Inter', sans-serif" font-size="11" fill="#1E40AF">Reward Game 2</text>
        <text x="16" y="74" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#2563EB">Play Now →</text>
      </g>
    </g>

    <!-- Transparent Monitoring Notice -->
    <g transform="translate(42, 665)">
      <rect width="373" height="110" rx="18" fill="#E2F3F1" stroke="#2D8B8B" stroke-width="1" stroke-opacity="0.3" />
      <text x="20" y="28" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#206E6E">TRANSPARENT PROTECTION NOTICE</text>
      <text x="20" y="52" font-family="'Inter', sans-serif" font-size="12" fill="#16212E">Safe web filter is active. Adult and phishing content</text>
      <text x="20" y="70" font-family="'Inter', sans-serif" font-size="12" fill="#16212E">are blocked to protect your digital learning journey.</text>
      <text x="20" y="92" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#2D8B8B">Learn why content is filtered →</text>
    </g>

    <!-- Bottom Tab Bar -->
    <g transform="translate(22, 850)">
      <rect width="413" height="76" fill="#ffffff" stroke="#DCE6E4" stroke-width="1" />
      <rect x="156" y="44" width="100" height="4" rx="2" fill="#16212E" />
      <circle cx="206" cy="18" r="24" fill="#EF4444" />
      <text x="206" y="23" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="900" fill="#ffffff">SOS</text>
      <text x="60" y="24" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#2D8B8B">Home</text>
      <text x="130" y="24" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#5C6773">Time</text>
      <text x="280" y="24" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#5C6773">Games</text>
      <text x="350" y="24" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#5C6773">Chat</text>
    </g>
